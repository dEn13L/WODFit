<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <style>
    /* Flutter on iOS measures documentElement.clientHeight. Keep that height
       inside Safari's expanding/collapsing browser chrome, including rotation.
       Disallow horizontal overflow and unwanted page zoom in mobile Safari. */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
  </style>
  <script>
    (function() {
      var desired = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';
      function enforceViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.name = 'viewport';
          meta.content = desired;
          document.head.appendChild(meta);
        } else if (meta.content !== desired) {
          meta.content = desired;
        }
      }
      enforceViewport();
      var observer = new MutationObserver(enforceViewport);
      observer.observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });

      // Disable pinch-zoom and double-tap gesture zooming on iOS Safari
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

      window._getSafeAreaInsets = function() {
        var el = document.getElementById('_safe_area_probe');
        if (!el) return { top: 0, right: 0, bottom: 0, left: 0 };
        var s = window.getComputedStyle(el);
        return {
          top: parseFloat(s.paddingTop) || 0,
          right: parseFloat(s.paddingRight) || 0,
          bottom: parseFloat(s.paddingBottom) || 0,
          left: parseFloat(s.paddingLeft) || 0
        };
      };
    })();
  </script>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CrossFit Training app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="wod_fit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>wod_fit</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="_safe_area_probe" style="position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
