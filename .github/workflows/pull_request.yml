name: Pull request checks

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sql-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: wod_fit_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: wod_fit_security_test
    steps:
      - uses: actions/checkout@v4
      - name: Restore schema fixture and verify security migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f test/sql/live_schema_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/12_harden_result_and_profile_access.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/13_result_integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/security_hardening_test.sql
          psql -X -At -v ON_ERROR_STOP=1 -f docs/security-hardening-postflight.sql | tee postflight.txt
          if grep -q "^FAIL|" postflight.txt; then exit 1; fi
          psql -X -v ON_ERROR_STOP=1 -f sql/14_atomic_workout_save.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/atomic_workout_save_test.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/15_program_workout_numbers.sql
          psql -X -v ON_ERROR_STOP=1 -f test/sql/program_workout_numbers_test.sql
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_ANON_KEY=ci-test-anon-key
